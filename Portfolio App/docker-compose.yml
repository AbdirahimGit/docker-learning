services:

  web:
    build:
      context: .
      dockerfile: Dockerfile

    image: count-app

    expose:
      - "5002"

    depends_on:
      - redis

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:5002/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine

    volumes:
      - redis-data:/data

  nginx:
    image: nginx:latest

    ports:
      - "5002:5002"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - web

volumes:
  redis-data: